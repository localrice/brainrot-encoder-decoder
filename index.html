<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainrot Encoder / Decoder</title>
  <style>
    body { background:#e0e0e0; font-family:Verdana, sans-serif; color:#111; margin:0; padding:20px }
    .container { background:#fff; border:2px solid #000; padding:15px; max-width:720px; margin:auto; box-shadow:4px 4px 0 #000 }
    h1 { font-size:22px; margin:0 0 10px; text-shadow:1px 1px 0 #fff }
    textarea { width:100%; height:100px; border:2px inset #ccc; font-family:monospace; padding:6px; box-sizing:border-box }
    button { background:#c0c0c0; border:2px outset #fff; padding:6px 12px; font-weight:bold; cursor:pointer; margin-right:6px }
    button:active { border:2px inset #fff; background:#a0a0a0 }
    .output { margin-top:12px; padding:10px; background:#f9f9f9; border:2px inset #ccc; font-family:monospace; white-space:pre-wrap }
    .encoded { color:#0044aa; font-weight:bold }
  </style>
</head>
<body>
  <div class="container">
    <h1>Brainrot Encoder / Decoder</h1>

    <textarea id="inputText" placeholder="Type your text here...">Hello world 123</textarea>
    <div style="margin-top:8px">
      <button onclick="encodeText()">Encode</button>
      <button onclick="decodeText()">Decode</button>
      <button onclick="copyOutput()">Copy Output</button>
    </div>

    <div id="output" class="output"></div>
    <p style="font-size:11px; color:#555; margin-top:10px; text-align:center;">
        <em>made by <strong>localrice</strong> without losing his sanity</em>
</p>

  </div>

  <script>
    const alphabetBrainrot = {
      a: 'alpha', b: 'based', c: 'cap', d: 'dab', e: 'ez', f: 'fanum',
      g: 'gyatt', h: 'heck', i: 'irrizz', j: 'jetfuel', k: 'kappa', l: 'lit',
      m: 'meme', n: 'npc', o: 'ohio', p: 'pog', q: 'quest', r: 'rizz',
      s: 'skibidi', t: 'thug', u: 'uwu', v: 'vibe', w: 'wiggle', x: 'xtra',
      y: 'yo', z: 'zaza'
    };

    const brainrotToAlpha = Object.fromEntries(Object.entries(alphabetBrainrot).map(([k,v]) => [v,k]));
    const spaceToken = 'gurt';

    function rot5EncodeDigit(ch) {
      const n = ch.charCodeAt(0) - 48;
      return String.fromCharCode(((n + 5) % 10) + 48);
    }
    function rot5DecodeDigit(ch) {
      const n = ch.charCodeAt(0) - 48;
      return String.fromCharCode(((n - 5 + 10) % 10) + 48);
    }

    function encodeText() {
      const text = document.getElementById('inputText').value;
      const tokens = [];

      for (let ch of text) {
        if (ch === ' ') {
          tokens.push(spaceToken);
        } else if (/[A-Za-z]/.test(ch)) {
          tokens.push(alphabetBrainrot[ch.toLowerCase()] || ch.toLowerCase());
        } else if (/\d/.test(ch)) {
          tokens.push(rot5EncodeDigit(ch));
        } else {
          tokens.push(ch);
        }
      }

      document.getElementById('output').textContent = 'Encoded string:\n' + tokens.join(' ');
    }

    function decodeText() {
      const raw = document.getElementById('inputText').value.trim();
      if (!raw) {
        document.getElementById('output').textContent = 'Decoded string:\n';
        return;
      }

      const parts = raw.split(/\s+/);
      let out = '';

      for (let token of parts) {
        const t = token.toLowerCase();
        if (t === spaceToken) {
          out += ' ';
        } else if (brainrotToAlpha[t]) {
          out += brainrotToAlpha[t];
        } else if (/^[0-9]$/.test(t)) {
          out += rot5DecodeDigit(t);
        } else if (t.length === 1) {
          out += t;
        } else {
          out += '?';
        }
      }

      document.getElementById('output').textContent = 'Decoded string:\n' + out;
    }

    function copyOutput() {
      const out = document.getElementById('output').textContent.replace(/^.*\n/, '');
      navigator.clipboard?.writeText(out).catch(() => {});
    }
  </script>
</body>
</html>
